<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <h1 class="app__title">Sheet: to do</h1>
        <div class="app__header-controls">
          <button class="btn btn--primary" id="createListBtn">
            + Add new sheet
          </button>
          <button class="btn btn--icon" id="bgPickerBtn" title="Change background">
            <i class="bi bi-palette"></i>
          </button>
        </div>
        <div class="bg-picker" id="bgPicker"></div>
      </header>

      <!-- lists -->
      <main class="app__main" id="listsContainer">

      </main>
    </div>

    <!-- modal for name input -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h2 class="modal__title" id="modalTitle">New sheet</h2>
        <input
          class="modal__input"
          type="text"
          id="modalInput"
          placeholder="Enter name..."
          maxlength="60"
        />
        <div class="modal__icon-picker" id="modalIconPicker">
          <p class="modal__icon-label">Choose your topic:</p>
          <div class="modal__icons-grid" id="modalIconsGrid"></div>
        </div>
        <div class="modal__actions">
          <button class="btn btn--secondary" id="modalCancelBtn">
            Cancel
          </button>
          <button class="btn btn--primary" id="modalConfirmBtn">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
